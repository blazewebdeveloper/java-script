<body>
    <p>Youtube Subscribe Button</p>
<button class="youtube" onclick="subscribe()">Subscribe</button>
<br><br>
<p>Rock Paper Scissor</p>
<a href="09-rock-paper-scissor.html">click here</a>
<br><br>
<p>Amazon Shipping Calculator orders</p>
<p>Orders Under $40=+$10 shipping.</p>
<p>Orders over $40=FREE shipping.</p>
<input placeholder="Cost of order" class="js-calculate" onkeydown="aaro()" >
<button class="milauna" onclick="calculate()" >Calculate</button>
<p class="js-result"></p>
<p class="yol"></p>


    <script>
        window.document
        window.console.log('window');

        function subscribe(){
    const buttonElement=document.querySelector('.youtube');

    if(buttonElement.innerHTML==='Subscribe'){
        buttonElement.innerHTML='Subscribed';
        buttonElement.classList.add('yoo');
    }else{
        buttonElement.innerHTML='Subscribe'; 
        buttonElement.classList.remove('yoo')
    }  
}

function calculate(){
    const calculation=document.querySelector('.js-calculate');
    let cost=Number(calculation.value);

    document.querySelector('.yol').innerHTML='';
    document.querySelector('.js-result').innerHTML='';
    if(cost<0){
         document.querySelector('.yol').innerHTML= `Error: Number cannot be less than $0`;
         return
    }
    if(cost<40){
        cost=Math.round(cost+10); //exercise 9 challenge question no. 9g
    }
    document.querySelector('.js-result').innerHTML=`$${cost}`;
    }
  


function aaro(){
    if(event.key==='Enter'){
        calculate();
    }
}

    </script>
