<body>
<p>Rock paper Scissors</p>
<button onclick="
playGame('rock'); "
>rock</button>
<button onclick="
playGame('paper');
">paper</button>
    <button onclick="
    playGame('scissor');
    ">scissor</button>
   
    <script>
function playGame(playerMove){
    const computer = pickComputerMove();
let result ='';
//for rock
if(playerMove ==='rock'){
if(computer==='rock'){
    result ='Tie';
}
else if(computer==='paper'){
result = 'lose';
}
else if(computer==='scissor'){
    result ='win';
}
}
//for paper
else if(playerMove==='paper'){
    
if(computer==='rock'){
    result ='win';
}
else if(computer==='paper'){
result = 'tie';
}
else if(computer==='scissor'){
    result ='lose';
}
}
//for scissor 
else if(playerMove==='scissor'){
    
if(computer==='rock'){
    result ='lose';
}
else if(computer==='paper'){
result = 'win';
}
else if(computer==='scissor'){
    result ='tie';
}
}
alert(`You Picked ${playerMove}.computer picked.${computer}.You${result}! `);

}

        
function pickComputerMove(){
    const random = Math.random();
let computer ='';
if(0<=random && random< 1/3){
    computer = 'rock';
}else if(1/3<=random && random<2/3){
    computer = 'paper';
}
else if(2/3<=random && random<1){
    computer = 'scissor';
}

return computer ;
}
    </script>
