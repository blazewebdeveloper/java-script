<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: black;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
    }
    button{
        background-color: rgb(71, 71, 71);
        border-radius: 50%;
        height: 100px;
        width: 100px;
        margin-right: 10px;
        border: 3px solid white;
        cursor: pointer;
    }
    img{
       height: 50px;
        background: transparent;
    }
    img:hover{
        transform: scale(1.2);
    }
    .hero{
        padding: 10px;
        background-color: rgb(213,213,213);
    }
</style>
<body>
    <p>lets play Rocks Paper & Scissors Game</p>
    <button onclick="game('rock')"><img src="rock-emoji.png" alt=""></button>
    <button onclick="game('paper')"><img src="paper-emoji.png" alt=""></button>
    <button onclick="game('scissor')"><img src="scissor-emoji.png" alt=""></button>
    <p class="result"></p>
    <p class="moves"></p>
    <p class="score"></p>
    <button class="hero" onclick="score.wins=0;score.loses=0;score.tie=0;
    localStorage.removeItem('core');
    updateScore()" >Reset</button>
    <script>
        let score=JSON.parse(localStorage.getItem('core'))||{wins:0,loses:0,tie:0};
        updateScore();
function game(a){
const ola =computerMove();
console.log(ola);
let result='';
if(a==='rock'){
    if(ola==='rock'){
result='Its Tie';
score.tie+=1;
    }
    else if(ola==='paper'){
        result='You Lose';
        score.loses+=1;
    }
    else if(ola==='scissor'){
        result='You win';
        score.wins+=1;
    }
}else if(a==='paper'){
     if(ola==='rock'){
result='You win';
score.wins+=1;
    }
    else if(ola==='paper'){
        result='Its Tie';
        score.tie+=1;
    }
    else if(ola==='scissor'){
        result='You Lose';
        score.loses+=1;
    }
}else if(a==='scissor'){
    if(ola==='rock'){
result='You lose';
score.loses+=1;
    }
    else if(ola==='paper'){
        result='You win';
        score.wins+=1;
    }
    else if(ola==='scissor'){
        result='Its Tie';
        score.tie+=1;
    } 
}
localStorage.setItem('core',JSON.stringify(score));
updateScore();
document.querySelector('.result').innerHTML=`${result}`;
document.querySelector('.moves').innerHTML=`You:<img src="${a}-emoji.png" alt=""> <img src="${ola}-emoji.png" alt="">:Computer`;
}
function updateScore(a,ola){
document.querySelector('.score').innerHTML=`Your Score: WINS:${score.wins},LOSES:${score.loses},TIE:${score.tie}`;

}

function computerMove(){
    const random=Math.random();
    let computer='';
    if(random>0&&random<1/3){
        computer='rock';
    }else if(random>=1/3&&random<2/3){
        computer='paper';
    }else if(random>=2/3&&random<1){
        computer='scissor';
    }
    return computer;
}

    </script>
</body>
</html>
