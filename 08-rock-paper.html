<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper & sicsor </title>
</head>
<body>
<p>Rock paper Scissors</p>
<button onclick="
playGame('rock'); "
>rock</button>
<button onclick="
playGame('paper');
">paper</button>
    <button onclick="
    playGame('scissor');
    ">scissor</button>
   
<button onclick="
score.Wins =0 ;
score.losses =0;
score.ties=0;
localStorage.removeItem('score');
">Reset</button>

    <script>
let score=JSON.parse(localStorage.getItem('score')) || {
        Wins: 0,
        losses:0,
        ties:0
    };



function playGame(playerMove){
    const computer = pickComputerMove();
let result ='';
//for rock
if(playerMove ==='rock'){
if(computer==='rock'){
    result ='tie';
}
else if(computer==='paper'){
result = 'lose';
}
else if(computer==='scissor'){
    result ='win';
}
}
//for paper
else if(playerMove==='paper'){
    
if(computer==='rock'){
    result ='win';
}
else if(computer==='paper'){
result = 'tie';
}
else if(computer==='scissor'){
    result ='lose';
}
}
//for scissor 
else if(playerMove==='scissor'){
    
if(computer==='rock'){
    result ='lose';
}
else if(computer==='paper'){
result = 'win';
}
else if(computer==='scissor'){
    result ='tie';
}
}
if(result==='win'){
    score.Wins +=1
}
else if(result==='lose'){
    score.losses +=1;
}
else if(result==='tie'){
    score.ties +=1;
}

localStorage.setItem('score', JSON.stringify(score));

alert(`You Picked ${playerMove}.computer picked.${computer}.You${result}!
Wins:${score.Wins} , Losses:${score.losses}, ties:${score.ties} `);

}

        
function pickComputerMove(){
    const random = Math.random();
let computer ='';
if(0<=random && random< 1/3){
    computer = 'rock';
}else if(1/3<=random && random<2/3){
    computer = 'paper';
}
else if(2/3<=random && random<1){
    computer = 'scissor';
}

return computer ;
}
    </script>
</body>
</html>
